name: Container
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all tested versions to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make check
  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        series: ['2.99', '3', '4', '5']
        wine: ['10', '11']
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Runner Docker version (diagnostics)
        run: docker version
      # 29.4.2 blocks socketcall and breaks Wine's 32-bit components.
      - name: Set up Docker with restored Wine compatibility
        uses: docker/setup-docker-action@v5
        with:
          version: v29.4.3
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
          SERIES: ${{ matrix.series }}
          WINE_VERSION: ${{ matrix.wine }}
        run: |
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SOURCE_URL=https://github.com/$REPOSITORY" >> "$GITHUB_ENV"
          echo "VERSION=$(python3 scripts/versions.py get "$SERIES" version)" >> "$GITHUB_ENV"
          {
            echo 'tags<<EOF'
            python3 scripts/image-tags.py "$SERIES" "$WINE_VERSION" "ghcr.io/${REPOSITORY,,}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image with GitHub Actions cache
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            SERIES=${{ matrix.series }}
            WINE_VERSION=${{ matrix.wine }}
            VERSION=${{ env.VERSION }}
            SOURCE_URL=${{ env.SOURCE_URL }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha,version=2,scope=ahnenblatt-${{ matrix.series }}-wine${{ matrix.wine }}
          cache-to: type=gha,version=2,scope=ahnenblatt-${{ matrix.series }}-wine${{ matrix.wine }},mode=max,ignore-error=true
      - name: Smoke test
        env:
          SERIES: ${{ matrix.series }}
          WINE_VERSION: ${{ matrix.wine }}
        run: make smoke
      - name: Publish tested image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          SERIES: ${{ matrix.series }}
          WINE_VERSION: ${{ matrix.wine }}
        run: |
          tag_list=$(python3 scripts/image-tags.py "$SERIES" "$WINE_VERSION" "$IMAGE")
          while IFS= read -r tag; do docker push "$tag"; done <<< "$tag_list"
