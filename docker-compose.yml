services:
  ahnenblatt:
    image: ${IMAGE:-ghcr.io/vknmnn/ahnenblatt-docker}:${SERIES:-3}
    platform: linux/amd64
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      CUSTOM_USER: ${CUSTOM_USER:-abc}
      PASSWORD: ${PASSWORD:-}
      FILE_MANAGER_PATH: /config/files
      LC_ALL: ${LC_ALL:-en_US.UTF-8}
    volumes:
      - ${CONFIG_DIR:-./data/3}:/config
      - ${DATA_DIR:-${CONFIG_DIR:-./data/3}/files}:/config/files
      # Optional host timezone; also set TZ=:/etc/localtime in .env.
      # - /etc/localtime:/etc/localtime:ro
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3001}:3001"
    shm_size: 1gb
    restart: unless-stopped

