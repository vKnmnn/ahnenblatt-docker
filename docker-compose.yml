services:
  ahnenblatt:
    image: ${IMAGE:-ghcr.io/vknmnn/ahnenblatt-docker}:${SERIES:-5}
    platform: linux/amd64
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      CUSTOM_USER: ${CUSTOM_USER:-abc}
      PASSWORD: ${PASSWORD:-}
      FILE_MANAGER_PATH: /config/files
      LC_ALL: ${LC_ALL:-en_US.UTF-8}
      SELKIES_UI_SIDEBAR_SHOW_STATS: ${SELKIES_UI_SIDEBAR_SHOW_STATS:-false}
      SELKIES_UI_SIDEBAR_SHOW_VIDEO_SETTINGS: ${SELKIES_UI_SIDEBAR_SHOW_VIDEO_SETTINGS:-false}
      SELKIES_UI_SIDEBAR_SHOW_SCREEN_SETTINGS: ${SELKIES_UI_SIDEBAR_SHOW_SCREEN_SETTINGS:-false}
      SELKIES_UI_SIDEBAR_SHOW_SHARING: ${SELKIES_UI_SIDEBAR_SHOW_SHARING:-false}
      SELKIES_ENABLE_SHARING: ${SELKIES_ENABLE_SHARING:-false|locked}
    volumes:
      - ${CONFIG_DIR:-./data/5}:/config
      - ${DATA_DIR:-${CONFIG_DIR:-./data/5}/files}:/config/files
      # Optional host timezone; also set TZ=:/etc/localtime in .env.
      # - /etc/localtime:/etc/localtime:ro
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3001}:3001"
    shm_size: 1gb
    restart: unless-stopped

