services:
  ahnenblatt:
    image: ${IMAGE:-ghcr.io/vknmnn/ahnenblatt-docker}:${SERIES:-2.99}
    platform: linux/amd64
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      CUSTOM_USER: ${CUSTOM_USER:-abc}
      PASSWORD: ${PASSWORD:-}
      FILE_MANAGER_PATH: /config/files
      LANG: ${APP_LOCALE:-en_US.UTF-8}
    volumes:
      - ${CONFIG_DIR:-./data/2.99}:/config
      - ${DATA_DIR:-${CONFIG_DIR:-./data/2.99}/files}:/config/files
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3001}:3001"
    shm_size: 1gb
    restart: unless-stopped

